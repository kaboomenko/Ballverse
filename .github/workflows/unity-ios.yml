name: Unity iOS

# 1) "Xcode project" (ubuntu): Unity exports the iOS Xcode project (IL2CPP, iOS 16+) and uploads it as a .tar.gz
#    artifact (tar keeps the executable bits Xcode build scripts need). Open it on a Mac: docs/dev/unity.md.
# 2) "Archive" (macOS, manual dispatch with archive = true): installs CocoaPods dependencies and archives the project.
#    With the signing secrets it produces a signed IPA; without them an unsigned .xcarchive (compile check only).
# Secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (required; jobs are skipped with a notice without them).
# Signing (optional, all four together): IOS_P12_BASE64, IOS_P12_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID.
# APPLE_TEAM_ID alone switches the Xcode project to automatic signing with that team.

on:
  workflow_dispatch:
    inputs:
      archive:
        description: "Also archive on macOS (signed IPA if signing secrets exist, unsigned archive otherwise)"
        type: boolean
        default: false
  push:
    branches:
      - "claude/**"
    paths:
      - "client/**"
      - ".github/workflows/unity-ios.yml"

concurrency:
  group: unity-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_VERSION: "0.1.${{ github.run_number }}"
  BUNDLE_ID: com.ballverse.app

jobs:
  check-secrets:
    name: Check secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
      signing: ${{ steps.check.outputs.signing }}
    steps:
      - name: Check Unity and signing secrets
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          missing=""
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity secrets are present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="iOS build skipped: repository secrets missing:${missing}. Add them as described in docs/dev/unity.md (Settings > Secrets and variables > Actions)."
            echo "::warning title=Unity secrets missing::${msg}"
            echo "### iOS build skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "$IOS_P12_BASE64" ] && [ -n "$IOS_P12_PASSWORD" ] && [ -n "$IOS_PROVISIONING_PROFILE_BASE64" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
            echo "iOS signing secrets are present."
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "iOS signing secrets are not (all) set: the macOS archive, if requested, is unsigned."
          fi

  xcode:
    name: Xcode project
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v6

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: client/Library
          key: Library-ios-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-ios-

      - name: Signing parameters for Unity
        id: signing
        env:
          SIGNING: ${{ needs.check-secrets.outputs.signing }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          params=""
          if [ "$SIGNING" = "true" ]; then
            profile="$RUNNER_TEMP/profile.mobileprovision"
            echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
            openssl smime -inform der -verify -noverify -in "$profile" -out "$RUNNER_TEMP/profile.plist" 2>/dev/null
            read -r uuid ptype < <(python3 -c 'import plistlib,sys; d=plistlib.load(open(sys.argv[1],"rb")); print(d["UUID"], "Development" if d.get("Entitlements",{}).get("get-task-allow") else "Distribution")' "$RUNNER_TEMP/profile.plist")
            rm -f "$profile" "$RUNNER_TEMP/profile.plist"
            params="-iosTeamId $APPLE_TEAM_ID -iosProvisioningProfileId $uuid -iosProvisioningProfileType $ptype"
            echo "Manual signing: profile $uuid ($ptype)."
          elif [ -n "$APPLE_TEAM_ID" ]; then
            params="-iosTeamId $APPLE_TEAM_ID"
            echo "Automatic signing with the team from APPLE_TEAM_ID."
          else
            echo "No team: choose a team in Xcode > Signing & Capabilities."
          fi
          echo "params=$params" >> "$GITHUB_OUTPUT"

      - name: Build Xcode project
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          targetPlatform: iOS
          buildMethod: Ballverse.Editor.BuildScript.BuildIosXcode
          buildName: Ballverse
          buildsPath: build
          versioning: Custom
          version: ${{ env.BUILD_VERSION }}
          customParameters: ${{ steps.signing.outputs.params }}

      - name: Pack Xcode project
        run: tar -czf ballverse-ios-xcode.tar.gz -C build/iOS Ballverse

      - name: Upload Xcode project
        uses: actions/upload-artifact@v6
        with:
          name: ballverse-ios-xcode-${{ env.BUILD_VERSION }}
          path: ballverse-ios-xcode.tar.gz
          if-no-files-found: error
          retention-days: 14

  archive:
    name: Archive (macOS)
    needs: [check-secrets, xcode]
    if: github.event_name == 'workflow_dispatch' && inputs.archive
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      SIGNING: ${{ needs.check-secrets.outputs.signing }}
    steps:
      - name: Download Xcode project
        uses: actions/download-artifact@v7
        with:
          name: ballverse-ios-xcode-${{ env.BUILD_VERSION }}

      - name: Unpack
        run: tar -xzf ballverse-ios-xcode.tar.gz

      - name: Install CocoaPods dependencies
        working-directory: Ballverse
        run: |
          if [ -f Podfile ]; then
            pod install --repo-update
          else
            echo "No Podfile; skipping CocoaPods."
          fi

      - name: Install signing certificate and provisioning profile
        if: env.SIGNING == 'true'
        env:
          IOS_P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$IOS_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

          profile="$RUNNER_TEMP/profile.mobileprovision"
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile"
          security cms -D -i "$profile" > "$RUNNER_TEMP/profile.plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")"
          if /usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$RUNNER_TEMP/profile.plist" 2>/dev/null | grep -q true; then
            method="debugging"
          elif /usr/libexec/PlistBuddy -c 'Print :ProvisionedDevices' "$RUNNER_TEMP/profile.plist" > /dev/null 2>&1; then
            method="release-testing"
          else
            method="app-store-connect"
          fi
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done

          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${method}</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${uuid}</string></dict>
            <key>compileBitcode</key><false/>
          </dict>
          </plist>
          PLIST
          echo "Installed profile $uuid; export method ${method}."

      - name: Archive
        working-directory: Ballverse
        run: |
          if [ -d Unity-iPhone.xcworkspace ]; then
            container=(-workspace Unity-iPhone.xcworkspace)
          else
            container=(-project Unity-iPhone.xcodeproj)
          fi
          common=("${container[@]}" -scheme Unity-iPhone -configuration Release -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Ballverse.xcarchive")
          if [ "$SIGNING" = "true" ]; then
            xcodebuild "${common[@]}" archive
          else
            xcodebuild "${common[@]}" archive CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
          fi

      - name: Export IPA
        if: env.SIGNING == 'true'
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Ballverse.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa"
          ls -la "$RUNNER_TEMP/ipa"

      - name: Upload IPA
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ballverse-ios-ipa-${{ env.BUILD_VERSION }}
          path: ${{ runner.temp }}/ipa/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Pack unsigned archive
        if: env.SIGNING != 'true'
        run: tar -czf "$RUNNER_TEMP/ballverse-ios-unsigned-xcarchive.tar.gz" -C "$RUNNER_TEMP" Ballverse.xcarchive

      - name: Upload unsigned archive
        if: env.SIGNING != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ballverse-ios-unsigned-xcarchive-${{ env.BUILD_VERSION }}
          path: ${{ runner.temp }}/ballverse-ios-unsigned-xcarchive.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Remove signing keychain
        if: always() && env.SIGNING == 'true'
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
