name: Unity tests

# EditMode tests of the Unity project (Ballverse.Tests): Core runs inside Unity, app composition root,
# build arguments, and ProjectSetup (URP 2D asset, boot scene, player settings).
# PlayMode smoke test (Ballverse.PlayModeTests, client/Assets/Ballverse/Tests/PlayMode/README.md): boots the real app from
# the boot scene and drives first run -> live run -> dice -> studio -> export -> gallery; fails on any error log.
# Needs the Unity license secrets described in docs/dev/unity.md; without them the jobs are skipped with a notice.
# The PlayMode smoke test's .NET checks (stand-in signature greps, editor + player compile, engine-free rule tests) need no
# Unity and no secrets: they run first, in seconds, and gate the PlayMode job.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - "client/**"
      - ".github/workflows/unity-tests.yml"

concurrency:
  group: unity-tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-secrets:
    name: Check Unity secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity secrets are present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="Unity tests skipped: repository secrets missing:${missing}. Add them as described in docs/dev/unity.md (Settings > Secrets and variables > Actions)."
            echo "::warning title=Unity secrets missing::${msg}"
            echo "### Unity tests skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi

  editmode:
    name: EditMode tests
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v6

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: client/Library
          key: Library-tests-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-tests-

      - name: Run EditMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          testMode: editmode
          artifactsPath: unity-test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unity-editmode-results
          path: ${{ steps.tests.outputs.artifactsPath || 'unity-test-results' }}
          if-no-files-found: warn

  playmode-dotnet:
    name: PlayMode smoke test checks (.NET 8, no Unity)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Compile check + rule tests of Ballverse.PlayModeTests
        run: bash "client/Assets/Ballverse/Tests/PlayMode/CompileCheck~/run.sh"

  playmode:
    name: PlayMode tests
    needs: [check-secrets, playmode-dotnet]
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    # Library import of a fresh project + software-GL export; the test itself has a 60 min NUnit timeout.
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v6

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: client/Library
          key: Library-playmode-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-playmode-

      # unity-test-runner runs the editor through the image's unity-editor wrapper (xvfb-run, no -nographics), so Play Mode
      # has an OpenGL Core device on Mesa llvmpipe. -ballverseSmokeRequireGpu makes the smoke test fail if that ever changes
      # instead of softening its GPU checks (see Tests/PlayMode/README.md, "Graphics device").
      - name: Run PlayMode tests
        id: tests
        uses: game-ci/unity-test-runner@v4.3.2
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          testMode: playmode
          artifactsPath: unity-playmode-results
          customParameters: -ballverseSmokeRequireGpu

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: unity-playmode-results
          path: ${{ steps.tests.outputs.artifactsPath || 'unity-playmode-results' }}
          if-no-files-found: warn
