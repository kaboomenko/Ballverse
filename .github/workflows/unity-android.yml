name: Unity Android

# Builds the APK (IL2CPP, ARM64; debug keystore unless the upload keystore secrets are set) for installing on a test
# phone, and on manual dispatch optionally the App Bundle signed with the upload keystore.
# Build variant (spec §7.9): OwnerTest on push (release-optimised, Google's test ads, fake store); on manual dispatch
# the "variant" input picks Dev, OwnerTest or Store for both the APK and the bundle.
# Secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (required; the jobs are skipped with a notice without them).
# Signing with the upload keystore (optional; APK and App Bundle): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS.
# Store builds refuse Google's sample AdMob app id (spec §8.9); a CI step also checks the Store bundle's manifest for it.
# See docs/dev/unity.md.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Build variant (spec §7.9): OwnerTest = release-optimised with test ads and fake store (owner's phone, internal testing); Dev = debug build; Store = store release, needs the real AdMob app id"
        type: choice
        options:
          - OwnerTest
          - Dev
          - Store
        default: OwnerTest
      bundle:
        description: "Also build the App Bundle (.aab) in the chosen variant"
        type: boolean
        default: false
  push:
    branches:
      - "claude/**"
    paths:
      - "client/**"
      - ".github/workflows/unity-android.yml"

# Pushes cancel older push runs of the same branch only; a manual run (App Bundle) is never cancelled by a push, and
# a second manual run waits for the first.
concurrency:
  group: unity-android-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

permissions:
  contents: read

env:
  BUILD_VERSION: "0.1.${{ github.run_number }}"
  # Target API required by Google Play for new apps and updates since 2026-08-31 (Android 16). GameCI installs
  # this SDK platform in the build container before Unity starts; BuildScript applies it to PlayerSettings.
  ANDROID_TARGET_SDK: AndroidApiLevel36
  # Push builds are OwnerTest; a manual run uses the chosen variant.
  VARIANT: ${{ github.event_name == 'workflow_dispatch' && inputs.variant || 'OwnerTest' }}

jobs:
  check-secrets:
    name: Check Unity secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity secrets are present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="Android build skipped: repository secrets missing:${missing}. Add them as described in docs/dev/unity.md (Settings > Secrets and variables > Actions)."
            echo "::warning title=Unity secrets missing::${msg}"
            echo "### Android build skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi

  apk:
    name: APK
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v6

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: client/Library
          key: Library-android-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-android-

      - name: Build APK
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          targetPlatform: Android
          buildMethod: Ballverse.Editor.BuildScript.BuildAndroidApk
          buildName: Ballverse
          buildsPath: build
          versioning: Custom
          version: ${{ env.BUILD_VERSION }}
          androidExportType: androidPackage
          androidTargetSdkVersion: ${{ env.ANDROID_TARGET_SDK }}
          customParameters: -ballverseVariant ${{ env.VARIANT }}
          # Optional: with the upload keystore every APK has the same signature, so a new build installs over the
          # previous one. Without it each CI container generates a new debug key (uninstall before reinstalling).
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'ballverse-upload.keystore' || '' }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ballverse-android-apk-${{ env.VARIANT }}-${{ env.BUILD_VERSION }}
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14

  aab:
    name: App Bundle
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.bundle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v6

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: client/Library
          key: Library-android-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-android-

      - name: Signing status
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning title=Debug-signed bundle::ANDROID_KEYSTORE_BASE64 is not set; the bundle is signed with the debug key and Google Play will reject it."
          fi
          if [ "$VARIANT" != "Store" ]; then
            echo "::notice title=${VARIANT} bundle::Test ads and fake store: for internal testing only, never promote this bundle to production."
          fi

      - name: Build App Bundle
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          targetPlatform: Android
          buildMethod: Ballverse.Editor.BuildScript.BuildAndroidAab
          buildName: Ballverse
          buildsPath: build
          versioning: Custom
          version: ${{ env.BUILD_VERSION }}
          androidExportType: androidAppBundle
          androidTargetSdkVersion: ${{ env.ANDROID_TARGET_SDK }}
          customParameters: -ballverseVariant ${{ env.VARIANT }}
          # GameCI writes the decoded keystore to client/<androidKeystoreName> when the base64 secret is set.
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'ballverse-upload.keystore' || '' }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Check Store manifest for Google sample ad ids
        if: env.VARIANT == 'Store'
        run: |
          aabs=(build/Android/*.aab)
          aab="${aabs[0]}"
          # The bundle manifest is a protobuf; its strings (meta-data values) are stored as plain UTF-8.
          if unzip -p "$aab" base/manifest/AndroidManifest.xml | grep -a -q "3940256099942544"; then
            echo "::error title=Test ads in Store bundle::The bundle manifest contains Google's sample AdMob app id. Enter the real id, or build the OwnerTest variant (spec §7.9, §8.9)."
            exit 1
          fi
          echo "No Google sample AdMob app id in the Store bundle manifest."

      - name: Upload App Bundle
        uses: actions/upload-artifact@v6
        with:
          name: ballverse-android-aab-${{ env.VARIANT }}-${{ env.BUILD_VERSION }}
          path: build/Android/*.aab
          if-no-files-found: error
          retention-days: 14
