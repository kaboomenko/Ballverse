name: Unity Android

# Builds the development APK (IL2CPP, ARM64; debug keystore unless the upload keystore secrets are set) for installing on a test phone, and on manual
# dispatch optionally the release App Bundle signed with the upload keystore.
# Secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD (required; the jobs are skipped with a notice without them).
# Signing with the upload keystore (optional; APK and App Bundle): ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASS, ANDROID_KEYALIAS_NAME, ANDROID_KEYALIAS_PASS.
# See docs/dev/unity.md.

on:
  workflow_dispatch:
    inputs:
      bundle:
        description: "Also build the release App Bundle (.aab)"
        type: boolean
        default: false
  push:
    branches:
      - "claude/**"
    paths:
      - "client/**"
      - ".github/workflows/unity-android.yml"

concurrency:
  group: unity-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_VERSION: "0.1.${{ github.run_number }}"
  # Target API required by Google Play for new apps and updates since 2026-08-31 (Android 16). GameCI installs
  # this SDK platform in the build container before Unity starts; BuildScript applies it to PlayerSettings.
  ANDROID_TARGET_SDK: AndroidApiLevel36

jobs:
  check-secrets:
    name: Check Unity secrets
    runs-on: ubuntu-latest
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: Check UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD
        id: check
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=""
          [ -n "$UNITY_LICENSE" ] || missing="$missing UNITY_LICENSE"
          [ -n "$UNITY_EMAIL" ] || missing="$missing UNITY_EMAIL"
          [ -n "$UNITY_PASSWORD" ] || missing="$missing UNITY_PASSWORD"
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Unity secrets are present."
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            msg="Android build skipped: repository secrets missing:${missing}. Add them as described in docs/dev/unity.md (Settings > Secrets and variables > Actions)."
            echo "::warning title=Unity secrets missing::${msg}"
            echo "### Android build skipped" >> "$GITHUB_STEP_SUMMARY"
            echo "${msg}" >> "$GITHUB_STEP_SUMMARY"
          fi

  apk:
    name: Development APK
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v6

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: client/Library
          key: Library-android-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-android-

      - name: Build APK
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          targetPlatform: Android
          buildMethod: Ballverse.Editor.BuildScript.BuildAndroidApk
          buildName: Ballverse
          buildsPath: build
          versioning: Custom
          version: ${{ env.BUILD_VERSION }}
          androidExportType: androidPackage
          androidTargetSdkVersion: ${{ env.ANDROID_TARGET_SDK }}
          # Optional: with the upload keystore every APK has the same signature, so a new build installs over the
          # previous one. Without it each CI container generates a new debug key (uninstall before reinstalling).
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'ballverse-upload.keystore' || '' }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: ballverse-android-apk-${{ env.BUILD_VERSION }}
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14

  aab:
    name: Release App Bundle
    needs: check-secrets
    if: needs.check-secrets.outputs.ready == 'true' && github.event_name == 'workflow_dispatch' && inputs.bundle
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v6

      - name: Cache Unity Library
        uses: actions/cache@v5
        with:
          path: client/Library
          key: Library-android-${{ hashFiles('client/Assets/**', 'client/Packages/**', 'client/ProjectSettings/**') }}
          restore-keys: |
            Library-android-

      - name: Signing status
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::warning title=Debug-signed bundle::ANDROID_KEYSTORE_BASE64 is not set; the bundle is signed with the debug key and Google Play will reject it."
          fi

      - name: Build App Bundle
        uses: game-ci/unity-builder@v5
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: client
          targetPlatform: Android
          buildMethod: Ballverse.Editor.BuildScript.BuildAndroidAab
          buildName: Ballverse
          buildsPath: build
          versioning: Custom
          version: ${{ env.BUILD_VERSION }}
          androidExportType: androidAppBundle
          androidTargetSdkVersion: ${{ env.ANDROID_TARGET_SDK }}
          # GameCI writes the decoded keystore to client/<androidKeystoreName> when the base64 secret is set.
          androidKeystoreBase64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          androidKeystoreName: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'ballverse-upload.keystore' || '' }}
          androidKeystorePass: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          androidKeyaliasName: ${{ secrets.ANDROID_KEYALIAS_NAME }}
          androidKeyaliasPass: ${{ secrets.ANDROID_KEYALIAS_PASS }}

      - name: Upload App Bundle
        uses: actions/upload-artifact@v6
        with:
          name: ballverse-android-aab-${{ env.BUILD_VERSION }}
          path: build/Android/*.aab
          if-no-files-found: error
          retention-days: 14
