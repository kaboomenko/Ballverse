name: Core tests

on:
  push:
    paths:
      - "client/Assets/Ballverse/Core/**"
      - "core-tests/**"
      - ".github/workflows/core-tests.yml"
  pull_request:
    paths:
      - "client/Assets/Ballverse/Core/**"
      - "core-tests/**"
      - ".github/workflows/core-tests.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore core-tests/Ballverse.Core.sln
      - name: Build (warnings as errors, banned APIs)
        run: dotnet build core-tests/Ballverse.Core.sln -c Release --no-restore
      - name: Test
        run: dotnet test core-tests/Ballverse.Core.sln -c Release --no-build --logger "trx;LogFileName=core-tests.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-results
          path: core-tests/**/TestResults/*.trx
